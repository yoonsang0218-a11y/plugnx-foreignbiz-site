<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 576" role="img" aria-labelledby="title desc">
  <title id="title">BackWon brand logo</title>
  <desc id="desc">BackWon logo with circular blue and warm accent mark and the text BACKWON.</desc>
  <defs>
    <linearGradient id="bw-ring" x1="260" y1="174" x2="656" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#07528c"/>
      <stop offset=".45" stop-color="#1b75bb"/>
      <stop offset=".66" stop-color="#f4a15c"/>
      <stop offset="1" stop-color="#0b5590"/>
    </linearGradient>
    <linearGradient id="bw-mark" x1="345" y1="198" x2="611" y2="328" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b5792"/>
      <stop offset=".52" stop-color="#fff7ed"/>
      <stop offset=".76" stop-color="#f3a45f"/>
      <stop offset="1" stop-color="#0d5b95"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0b5590" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1024" height="576" fill="#fbfbf8"/>
  <circle cx="512" cy="206" r="113" fill="none" stroke="#eff1ed" stroke-width="34"/>
  <g filter="url(#soft-shadow)">
    <circle cx="512" cy="206" r="101" fill="none" stroke="url(#bw-ring)" stroke-width="18" stroke-linecap="round"/>
    <path d="M415 258c33-103 85-126 128-61 12 18 22 31 38 28 23-5 35-43 28-81 30 41 26 110-13 137-38 26-69 5-100-44-17-28-31-35-49-16-17 19-25 50-32 37z" fill="none" stroke="url(#bw-mark)" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M420 264c58-73 105-84 143-37 22 26 43 40 75 22-17 55-73 78-119 36-43-40-57-71-99-21z" fill="none" stroke="#0a5a95" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity=".88"/>
  </g>
  <text x="512" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="74" font-weight="800" letter-spacing="2" fill="#0b4f8a">BACKWON</text>
  <text x="512" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" letter-spacing="2.5" fill="#a5a5a1">TAX REFUND SERVICE FOR FOREIGN WORKERS</text>
